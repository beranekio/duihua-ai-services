name: Helm Kind Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind-test:
    name: Helm chart on kind cluster
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: duihua-kind-test
          config: kind/cluster.yaml

      - name: Install KEDA
        env:
          CLUSTER_NAME: duihua-kind-test
        run: scripts/install-keda.sh

      - name: Build and load gateway image
        env:
          CLUSTER_NAME: duihua-kind-test
          GATEWAY_IMAGE_TAG: ci-${{ github.sha }}
        run: scripts/build-and-load-images.sh

      - name: Build and load mock-vllm image
        env:
          CLUSTER_NAME: duihua-kind-test
          MOCK_VLLM_IMAGE_TAG: ci-${{ github.sha }}
        run: scripts/build-and-load-mock-vllm.sh

      - name: Deploy Helm chart
        env:
          CLUSTER_NAME: duihua-kind-test
          GATEWAY_IMAGE_TAG: ci-${{ github.sha }}
          EXTRA_VALUES_FILE: charts/duihua-ai-services/values-kind-ci.yaml
          INFERENCE_ENABLED: "false"
        run: scripts/deploy-kind.sh

      - name: Deploy mock-vllm upstream
        env:
          CLUSTER_NAME: duihua-kind-test
          MOCK_VLLM_IMAGE_TAG: ci-${{ github.sha }}
        run: scripts/deploy-mock-vllm-kind.sh

      - name: Run gateway smoke tests
        env:
          KUBECTL_CONTEXT: kind-duihua-kind-test
        run: scripts/smoke-test-kind.sh