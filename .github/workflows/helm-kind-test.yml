name: Helm Kind Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      inference_enabled:
        description: "Enable bundled inference deployments (pulls large vLLM image)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  kind-test:
    name: Helm chart on kind cluster
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: duihua-kind-test
          config: kind/cluster.yaml

      - name: Install KEDA
        env:
          CLUSTER_NAME: duihua-kind-test
        run: scripts/install-keda.sh

      - name: Build and load gateway image
        env:
          CLUSTER_NAME: duihua-kind-test
          GATEWAY_IMAGE_TAG: ci-${{ github.sha }}
        run: scripts/build-and-load-images.sh

      - name: Deploy Helm chart
        env:
          CLUSTER_NAME: duihua-kind-test
          GATEWAY_IMAGE_TAG: ci-${{ github.sha }}
          INFERENCE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.inference_enabled || 'false' }}
        run: scripts/deploy-kind.sh

      - name: Verify gateway is reachable
        run: |
          set -euo pipefail
          echo "Waiting for gateway to be ready..."
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8080/healthz >/dev/null; then
              echo "Gateway healthz OK"
              break
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "Checking /v1/models endpoint..."
          curl -sf http://127.0.0.1:8080/v1/models | head -c 500
          echo
          echo "Smoke test passed."
