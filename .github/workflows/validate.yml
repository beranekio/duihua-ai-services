name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Build chart dependencies
        run: helm dependency build charts/duihua-ai-services

      - name: Lint chart
        run: |
          helm lint charts/duihua-ai-services \
            -f charts/duihua-ai-services/values-kind.yaml \
            --set duihua-gateway.responsesApiStore.endpoint=http://duihua-responses-api-store:50051 \
            --set duihua-background-worker.responsesApiStore.endpoint=http://duihua-responses-api-store:50051 \
            --set duihua-background-worker.autoscaling.metricsUrl=http://duihua-responses-api-store.duihua.svc.cluster.local:8080/metrics/background-queue?consumer_group=duihua-background

      - name: Verify default values fail validation
        run: |
          if helm template duihua charts/duihua-ai-services >/tmp/helm-default.yaml 2>/tmp/helm-default.err; then
            echo "Expected default values to fail configValidation" >&2
            exit 1
          fi
          grep -q "modelUpstreams" /tmp/helm-default.err

      - name: Render templates
        run: |
          helm template duihua charts/duihua-ai-services \
            -f charts/duihua-ai-services/values-kind.yaml \
            --set duihua-gateway.responsesApiStore.endpoint=http://duihua-responses-api-store:50051 \
            --set duihua-gateway.env.modelUpstreams="HuggingFaceTB/SmolLM2-135M-Instruct=http://duihua-duihua-ai-services-inference-0-proxy:8080/v1" \
            --set duihua-background-worker.responsesApiStore.endpoint=http://duihua-responses-api-store:50051 \
            --set duihua-background-worker.autoscaling.metricsUrl=http://duihua-responses-api-store.duihua.svc.cluster.local:8080/metrics/background-queue?consumer_group=duihua-background \
            --debug > /tmp/helm-rendered.yaml
          helm template duihua charts/duihua-ai-services \
            -f charts/duihua-ai-services/values-kind.yaml \
            --set duihua-gateway.responsesApiStore.endpoint=http://duihua-responses-api-store:50051 \
            --set duihua-gateway.env.modelUpstreams="HuggingFaceTB/SmolLM2-135M-Instruct=http://duihua-duihua-ai-services-inference-0-proxy:8080/v1" \
            --set duihua-background-worker.responsesApiStore.endpoint=http://duihua-responses-api-store:50051 \
            --set duihua-background-worker.autoscaling.metricsUrl=http://duihua-responses-api-store.duihua.svc.cluster.local:8080/metrics/background-queue?consumer_group=duihua-background \
            --set ingress.enabled=true \
            --debug > /tmp/helm-rendered-ingress.yaml