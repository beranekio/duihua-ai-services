name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  dockerfile:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint background worker Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: services/background-worker/Dockerfile

  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Build chart dependencies
        run: helm dependency build charts/duihua-ai-services

      - name: Lint chart
        run: helm lint charts/duihua-ai-services -f charts/duihua-ai-services/values-kind.yaml

      - name: Verify default values fail validation
        run: |
          if helm template duihua charts/duihua-ai-services >/tmp/helm-default.yaml 2>/tmp/helm-default.err; then
            echo "Expected default values to fail configValidation" >&2
            exit 1
          fi
          grep -q "modelUpstreams" /tmp/helm-default.err

      - name: Render templates
        run: |
          helm template duihua charts/duihua-ai-services \
            -f charts/duihua-ai-services/values-kind.yaml \
            --set duihua-gateway.responsesApiStore.endpoint=http://duihua-responses-api-store:50051 \
            --set duihua-gateway.env.modelUpstreams="HuggingFaceTB/SmolLM2-135M-Instruct=http://duihua-duihua-ai-services-inference-0-proxy:8080/v1" \
            --debug > /tmp/helm-rendered.yaml
          helm template duihua charts/duihua-ai-services \
            -f charts/duihua-ai-services/values-kind.yaml \
            --set duihua-gateway.responsesApiStore.endpoint=http://duihua-responses-api-store:50051 \
            --set duihua-gateway.env.modelUpstreams="HuggingFaceTB/SmolLM2-135M-Instruct=http://duihua-duihua-ai-services-inference-0-proxy:8080/v1" \
            --set ingress.enabled=true \
            --debug > /tmp/helm-rendered-ingress.yaml
