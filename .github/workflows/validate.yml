name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/gateway/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/gateway/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  dockerfile:
    name: Dockerfile validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build gateway image
        run: docker build -f services/gateway/Dockerfile services/gateway

  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint charts/duihua-ai-services

      - name: Render templates
        run: helm template duihua-ai-services charts/duihua-ai-services --debug > /tmp/helm-rendered.yaml

  kind:
    name: Kind smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: duihua-local
          config: kind/cluster.yaml

      - name: Build gateway image
        run: docker build -t duihua-gateway:kind -f services/gateway/Dockerfile services/gateway

      - name: Deploy chart to kind
        run: VALUES_FILE=charts/duihua-ai-services/values-kind-smoke.yaml SKIP_CLUSTER_CREATION=1 SKIP_IMAGE_BUILD=1 ./scripts/deploy-kind.sh
