{{- if eq (include "duihua.background.enabled" .) "true" }}
{{- $_ := include "duihua.validate.config" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "duihua.fullname" . }}-background-worker
spec:
  {{- if ne (include "duihua.background.autoscaling.enabled" .) "true" }}
  replicas: {{ .Values.backgroundWorker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "duihua.fullname" . }}-background-worker
  template:
    metadata:
      labels:
        app: {{ include "duihua.fullname" . }}-background-worker
    spec:
      terminationGracePeriodSeconds: {{ .Values.backgroundWorker.terminationGracePeriodSeconds }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "duihua.serviceAccountName" . }}
      {{- else if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      {{- end }}
      containers:
        - name: background-worker
          image: "{{ .Values.backgroundWorker.image.repository }}:{{ .Values.backgroundWorker.image.tag }}"
          imagePullPolicy: {{ .Values.backgroundWorker.image.pullPolicy }}
          env:
            - name: RESPONSES_API_STORE_ENDPOINT
              value: {{ include "duihua.responsesApiStoreEndpoint" . | quote }}
            - name: RESPONSE_ID_STORE_TTL_SECONDS
              value: {{ dig "env" "responseIdStoreTtlSeconds" "86400" (get .Values "duihua-gateway" | default dict) | quote }}
            - name: BACKGROUND_QUEUE_CONSUMER_GROUP
              value: {{ .Values.backgroundWorker.consumerGroup | quote }}
            - name: BACKGROUND_QUEUE_CONSUMER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BACKGROUND_QUEUE_BLOCK_MS
              value: {{ .Values.backgroundWorker.blockMs | quote }}
            - name: BACKGROUND_QUEUE_PENDING_RETRY_SECONDS
              value: {{ .Values.backgroundWorker.pendingRetrySeconds | quote }}
            - name: BACKGROUND_QUEUE_MAX_CONCURRENT_JOBS
              value: {{ .Values.backgroundWorker.maxConcurrentJobs | quote }}
            - name: BACKGROUND_UPSTREAM_TIMEOUT_SECONDS
              value: {{ .Values.backgroundWorker.upstreamTimeoutSeconds | quote }}
          resources:
{{ toYaml .Values.backgroundWorker.resources | indent 12 }}
{{- end }}