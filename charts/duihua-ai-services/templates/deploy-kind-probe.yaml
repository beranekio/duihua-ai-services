{{- if .Values.deployKindProbe.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "duihua.fullname" . }}-deploy-kind-probe
data:
  duihuaFullname: {{ include "duihua.fullname" . | quote }}
  gatewayFullname: {{ include "duihua.gateway.fullname" . | quote }}
  serviceAccountName: {{ include "duihua.serviceAccountName" . | quote }}
  parentServiceAccountCreate: {{ .Values.serviceAccount.create | quote }}
  modelUpstreams: {{ include "duihua.gateway.modelUpstreams" . | quote }}
  configuredStoreEndpoint: {{ dig "responsesApiStore" "endpoint" "" (index .Values "duihua-gateway" | default dict) | quote }}
  responsesApiStoreServiceEnabled: {{ include "duihua.responsesApiStoreService.enabled" . | quote }}
  backgroundWorkerFullname: {{ include "duihua.backgroundWorker.fullname" . | quote }}
  backgroundWorkerMetricsUrl: {{ include "duihua.backgroundWorker.autoscaling.metricsUrl" . | quote }}
{{- end }}