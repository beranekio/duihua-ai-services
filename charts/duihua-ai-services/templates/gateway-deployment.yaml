{{- $autoscalingEnabled := true }}
{{- if hasKey .Values.inference.autoscaling "enabled" }}
{{- $autoscalingEnabled = .Values.inference.autoscaling.enabled }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "duihua.fullname" . }}-gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "duihua.fullname" . }}-gateway
  template:
    metadata:
      labels:
        app: {{ include "duihua.fullname" . }}-gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          env:
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
            - name: DEFAULT_MODEL
              value: {{ .Values.gateway.env.defaultModel | quote }}
            - name: UPSTREAM_BASE_URL
              value: {{ .Values.gateway.env.upstreamBaseUrl | quote }}
            - name: MODEL_UPSTREAMS
              {{- if .Values.inference.enabled }}
              value: "{{- range $index, $model := .Values.inference.models }}{{ if $index }},{{ end }}{{ $model.name }}={{- if $autoscalingEnabled }}{{ $.Values.inference.autoscaling.interceptorProxyUrl }}/{{ include "duihua.fullname" $ }}-inference-{{ $index }}/v1{{- else }}http://{{ include "duihua.fullname" $ }}-inference-{{ $index }}:8000/v1{{- end }}{{- end }}"
              {{- else }}
              value: ""
              {{- end }}
          resources:
{{ toYaml .Values.gateway.resources | indent 12 }}
