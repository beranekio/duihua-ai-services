apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "duihua.fullname" . }}-gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "duihua.fullname" . }}-gateway
  template:
    metadata:
      labels:
        app: {{ include "duihua.fullname" . }}-gateway
    spec:
      serviceAccountName: {{ include "duihua.serviceAccountName" . }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          env:
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
            - name: DEFAULT_MODEL
              value: {{ .Values.gateway.env.defaultModel | quote }}
            - name: UPSTREAM_BASE_URL
              value: {{ .Values.gateway.env.upstreamBaseUrl | quote }}
            - name: RESPONSES_API_STORE_ENABLED
              value: {{ .Values.gateway.responsesApiStore.enabled | quote }}
            - name: RESPONSE_ID_STORE_URL
              {{ if .Values.valkey.enabled }}
              value: "redis://{{ include "duihua.fullname" . }}-valkey:{{ .Values.valkey.service.port }}"
              {{ else }}
              value: {{ .Values.gateway.env.responseIdStoreUrl | quote }}
              {{ end }}
            - name: RESPONSE_ID_STORE_KEY_PREFIX
              value: {{ .Values.gateway.env.responseIdStoreKeyPrefix | quote }}
            - name: RESPONSE_ID_STORE_TTL_SECONDS
              value: {{ .Values.gateway.env.responseIdStoreTtlSeconds | quote }}
            {{- if and .Values.gateway.responsesApiStore.enabled .Values.gateway.responsesApiStore.backgroundJobs.enabled }}
            - name: RESPONSES_BACKGROUND_JOBS_ENABLED
              value: "true"
            - name: BACKGROUND_JOB_IMAGE
              value: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
            - name: BACKGROUND_JOB_IMAGE_PULL_POLICY
              value: {{ .Values.gateway.image.pullPolicy | quote }}
            - name: BACKGROUND_JOB_SERVICE_ACCOUNT_NAME
              value: {{ include "duihua.serviceAccountName" . | quote }}
            - name: BACKGROUND_JOB_TTL_SECONDS_AFTER_FINISHED
              value: {{ .Values.gateway.responsesApiStore.backgroundJobs.ttlSecondsAfterFinished | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            - name: MODEL_UPSTREAMS
              {{ if .Values.inference.enabled }}
              value: "{{- range $index, $model := .Values.inference.models }}{{ if $index }},{{ end }}{{ $model.name }}=http://{{ include "duihua.fullname" $ }}-inference-{{ $index }}-proxy:8080/v1{{- end }}"
              {{ else }}
              value: ""
              {{ end }}
          resources:
{{ toYaml .Values.gateway.resources | indent 12 }}
