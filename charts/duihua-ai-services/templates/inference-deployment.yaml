{{- if .Values.inference.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "duihua.fullname" . }}-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "duihua.fullname" . }}-inference
  template:
    metadata:
      labels:
        app: {{ include "duihua.fullname" . }}-inference
    spec:
      containers:
        - name: vllm
          image: "{{ .Values.inference.image.repository }}:{{ .Values.inference.image.tag }}"
          imagePullPolicy: {{ .Values.inference.image.pullPolicy }}
          args: ["--model", {{ .Values.inference.model | quote }}, "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          resources:
{{ toYaml .Values.inference.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "duihua.fullname" . }}-inference
spec:
  type: ClusterIP
  selector:
    app: {{ include "duihua.fullname" . }}-inference
  ports:
    - name: http
      port: 8000
      targetPort: 8000
{{- end }}
