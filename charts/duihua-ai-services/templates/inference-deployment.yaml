{{- if .Values.inference.enabled }}
{{- $fullName := include "duihua.fullname" . }}
{{- $autoscalingEnabled := true }}
{{- if hasKey .Values.inference.autoscaling "enabled" }}
{{- $autoscalingEnabled = .Values.inference.autoscaling.enabled }}
{{- end }}
{{- range $index, $model := .Values.inference.models }}
{{- $name := printf "%s-inference-%d" $fullName $index }}
{{- $defaultAutoscaling := $.Values.inference.autoscaling.default | default dict }}
{{- $modelAutoscaling := $model.autoscaling | default dict }}
{{- $autoscaling := mergeOverwrite (deepCopy $defaultAutoscaling) $modelAutoscaling }}
{{- $replicas := $.Values.inference.replicaCount | default 1 }}
{{- if hasKey $model "replicaCount" }}
{{- $replicas = $model.replicaCount }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: {{ if $autoscalingEnabled }}{{ $autoscaling.replicas.min | default 0 }}{{ else }}{{ $replicas }}{{ end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: vllm
          image: "{{ $.Values.inference.image.repository }}:{{ $.Values.inference.image.tag }}"
          imagePullPolicy: {{ $.Values.inference.image.pullPolicy }}
          args: ["--model", {{ $model.name | quote }}, "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          resources:
{{ toYaml (default $.Values.inference.resources $model.resources) | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
{{- if $autoscalingEnabled }}
---
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: {{ $name }}
  {{- with $autoscaling.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  target:
    service: {{ $name }}
    port: 8000
  {{- $hosts := ($autoscaling.hosts | default list) }}
  rules:
    -
      {{- if gt (len $hosts) 0 }}
      hosts:
      {{- range $host := $hosts }}
        - {{ $host | quote }}
      {{- end }}
      {{- end }}
  {{- $pathPrefixes := ($autoscaling.pathPrefixes | default (list "/")) }}
      paths:
      {{- range $path := $pathPrefixes }}
        - value: {{ $path | quote }}
      {{- end }}
  scalingMetric:
    concurrency:
      targetValue: {{ $autoscaling.targetPendingRequests | default 100 }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}
  {{- with $autoscaling.scaledObjectAnnotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    name: {{ $name }}
    kind: Deployment
    apiVersion: apps/v1
  minReplicaCount: {{ $autoscaling.replicas.min | default 0 }}
  maxReplicaCount: {{ $autoscaling.replicas.max | default 1 }}
  cooldownPeriod: {{ $autoscaling.scaledownPeriod | default 300 }}
  triggers:
    - type: external-push
      metadata:
        scalerAddress: {{ $autoscaling.scalerAddress | default "keda-add-ons-http-external-scaler.keda:9090" | quote }}
        interceptorRoute: {{ $name | quote }}
---
{{- end }}
{{- end }}
{{- end }}
