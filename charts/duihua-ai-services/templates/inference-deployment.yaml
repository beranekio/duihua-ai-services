{{- if .Values.inference.enabled }}
{{- $fullName := include "duihua.fullname" . }}
{{- range $index, $model := .Values.inference.models }}
{{- $name := printf "%s-inference-%d" $fullName $index }}
{{- $proxyServiceName := printf "%s-proxy" $name }}
{{- $defaultAutoscaling := $.Values.inference.autoscaling.default | default dict }}
{{- $modelAutoscaling := $model.autoscaling | default dict }}
{{- $autoscaling := mergeOverwrite (deepCopy $defaultAutoscaling) $modelAutoscaling }}
{{- $baseArgs := list $model.name "--host" "0.0.0.0" "--port" "8000" }}
{{- $globalExtraArgs := $.Values.inference.extraArgs | default list }}
{{- $modelExtraArgs := $model.extraArgs | default list }}
{{- $args := concat $baseArgs $globalExtraArgs $modelExtraArgs }}
{{- $proxyUrl := $.Values.inference.autoscaling.interceptorProxyUrl | default "http://keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local:8080" }}
{{- $proxyUrlParts := urlParse $proxyUrl }}
{{- $proxyHostPort := $proxyUrlParts.host | default "" }}
{{- $proxyHost := (regexReplaceAll ":[0-9]+$" $proxyHostPort "") | default "keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local" }}
{{- $proxyPortMatch := regexFind ":[0-9]+$" $proxyHostPort | default "" }}
{{- $proxyPort := (trimPrefix ":" $proxyPortMatch) | default "8080" }}
{{- $defaultRouteHosts := list $proxyServiceName (printf "%s.%s.svc.cluster.local" $proxyServiceName $.Release.Namespace) }}
{{- $configuredHosts := $autoscaling.hosts | default list }}
{{- $routeHosts := concat $defaultRouteHosts $configuredHosts }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: {{ $autoscaling.replicas.min | default 0 }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: vllm
          image: "{{ $.Values.inference.image.repository }}:{{ $.Values.inference.image.tag }}"
          imagePullPolicy: {{ $.Values.inference.image.pullPolicy }}
          args:
{{- range $arg := $args }}
            - {{ $arg | quote }}
{{- end }}
          ports:
            - containerPort: 8000
          resources:
{{ toYaml (default $.Values.inference.resources $model.resources) | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $proxyServiceName }}
spec:
  type: ExternalName
  externalName: {{ $proxyHost }}
  ports:
    - name: http
      port: {{ $proxyPort | int }}
      targetPort: {{ $proxyPort | int }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: {{ $name }}
  {{- with $autoscaling.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  target:
    service: {{ $name }}
    port: 8000
  rules:
    -
      {{- if gt (len $routeHosts) 0 }}
      hosts:
      {{- range $host := $routeHosts }}
        - {{ $host | quote }}
      {{- end }}
      {{- end }}
  {{- $pathPrefixes := ($autoscaling.pathPrefixes | default (list "/")) }}
      paths:
      {{- range $path := $pathPrefixes }}
        - value: {{ $path | quote }}
      {{- end }}
  scalingMetric:
    concurrency:
      targetValue: {{ $autoscaling.targetPendingRequests | default 100 }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}
  {{- with $autoscaling.scaledObjectAnnotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    name: {{ $name }}
    kind: Deployment
    apiVersion: apps/v1
  minReplicaCount: {{ $autoscaling.replicas.min | default 0 }}
  maxReplicaCount: {{ $autoscaling.replicas.max | default 1 }}
  cooldownPeriod: {{ $autoscaling.scaledownPeriod | default 300 }}
  triggers:
    - type: external-push
      metadata:
        scalerAddress: {{ $autoscaling.scalerAddress | default "keda-add-ons-http-external-scaler.keda:9090" | quote }}
        interceptorRoute: {{ $name | quote }}
---
{{- end }}
{{- end }}
