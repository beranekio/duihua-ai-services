{{- if .Values.valkey.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "duihua.fullname" . }}-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "duihua.fullname" . }}-valkey
  template:
    metadata:
      labels:
        app: {{ include "duihua.fullname" . }}-valkey
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}"
          imagePullPolicy: {{ .Values.valkey.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.valkey.service.port }}
          args:
            - "--save"
            - ""
            - "--appendonly"
            - "no"
          readinessProbe:
            tcpSocket:
              port: {{ .Values.valkey.service.port }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.valkey.service.port }}
          resources:
{{ toYaml .Values.valkey.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "duihua.fullname" . }}-valkey
spec:
  type: ClusterIP
  selector:
    app: {{ include "duihua.fullname" . }}-valkey
  ports:
    - name: redis
      port: {{ .Values.valkey.service.port }}
      targetPort: {{ .Values.valkey.service.port }}
{{- end }}
