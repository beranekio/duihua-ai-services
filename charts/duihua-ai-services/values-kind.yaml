gateway:
  image:
    repository: duihua-gateway
    tag: kind
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    defaultModel: Qwen/Qwen3.5-0.8B
    upstreamBaseUrl: http://127.0.0.1:9/v1

inference:
  enabled: true
  image:
    repository: vllm/vllm-openai-cpu
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  models:
    - name: Qwen/Qwen3.5-0.8B
      replicaCount: 1
      resources:
        requests:
          cpu: "2"
          memory: 6Gi
        limits:
          cpu: "4"
          memory: 8Gi
  autoscaling:
    enabled: false
