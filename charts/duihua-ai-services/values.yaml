x-consumerGroup: &consumer-group duihua-background

configValidation:
  # Enable strict chart validation (inference routing, store endpoint, consumer groups).
  # Turn on in environment overlays such as values-kind.yaml.
  enabled: false

responsesApiStoreService:
  # Deploy the beranekio/responses-api-store gRPC service subchart from GHCR
  # (oci://ghcr.io/beranekio/charts). Gateway and background worker talk to
  # this service instead of Valkey directly.
  enabled: false

responses-api-store:
  # Image repository/tag are set by the published OCI chart (git-sha tag).
  metrics:
    enabled: true
    port: 8080
  store:
    keyPrefix: responses-api-store:responses
    ttlSeconds: 86400
    staleSeconds: 3600
  backgroundQueue:
    streamKey: responses-api-store:background
    streamMaxlen: 10000
  valkey:
    enabled: true
    image:
      repository: valkey/valkey
      tag: "9.1.0-alpine"
      pullPolicy: IfNotPresent
    service:
      port: 6379

duihua-gateway:
  # Image repository/tag are set by the published OCI chart (git-sha tag).
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    responseIdStoreTtlSeconds: "86400"
    defaultModel: google/gemma-4-31B-it
    upstreamBaseUrl: http://vllm:8000/v1
    # Comma-separated model=url entries for per-model inference routing.
    # When inference.enabled=true, set entries like
    # "model-a=http://<release>-duihua-ai-services-inference-0-proxy:8080/v1".
    modelUpstreams: ""
  responsesApiStore:
    # Persist completed Responses API objects via the responses-api-store gRPC
    # service. This does not enable vLLM's in-memory response store, so inference
    # deployments may use multiple replicas and scale to zero.
    enabled: false
    # Override the gRPC endpoint; when empty at deploy time, set explicitly or
    # use scripts/deploy-kind.sh which wires the subchart Service automatically.
    endpoint: ""
    backgroundJobs:
      enabled: true
      consumerGroup: *consumer-group
    # Override the store metrics URL for KEDA when responsesApiStoreService.enabled=false.
    metricsUrl: ""

backgroundWorker:
  # Consume background=true Responses API jobs from a Valkey stream when the
  # gateway response store is enabled.
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/example/duihua-background-worker
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  consumerGroup: *consumer-group
  # Keep below the responses-api-store Valkey client response timeout (500ms).
  blockMs: 400
  pendingRetrySeconds: 30
  # Maximum simultaneous upstream calls per worker pod.
  maxConcurrentJobs: 1
  # SIGTERM grace for rollout drain; should exceed upstream timeout + blockMs + margin.
  terminationGracePeriodSeconds: 665
  upstreamTimeoutSeconds: "600"
  autoscaling:
    # Scale the worker Deployment via KEDA (no HTTP add-on needed).
    # driver store-metrics: queries responses-api-store GET /metrics/background-queue (default).
    # driver redis-streams: legacy Valkey stream lag scaler (deprecated).
    enabled: false
    driver: store-metrics
    # Threshold aliases; prefer jobsPerReplica / activationTargetValue for store-metrics.
    lagCount: 5
    activationLagCount: 0
    # Override when responsesApiStoreService.enabled=false or metrics are exposed elsewhere.
    metricsUrl: ""
    scaledownPeriod: 300
    pollingInterval: 15
    # redis-streams driver only: TLS/password for direct Valkey access.
    enableTLS: false
    passwordFromEnv: ""
    replicas:
      min: 1
      max: 4
    scaledObjectAnnotations: {}
  queueBootstrap:
    # Deprecated: the gateway ensures the stream consumer group via gRPC on startup when
    # background jobs are enabled (including scale-to-zero with replicas.min: 0). Values
    # below are unused; kept for a possible future Helm hook if needed.
    image:
      repository: redis
      tag: 7-alpine
      pullPolicy: IfNotPresent
    # When using an external rediss:// store, set true only if you accept skipping TLS
    # verification for the bootstrap connection (prefer mounting a CA via a future option).
    tlsInsecure: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

inference:
  enabled: true
  image:
    repository: vllm/vllm-openai
    tag: latest
    pullPolicy: IfNotPresent
  # Additional arguments appended to every vLLM inference container.
  extraArgs: []
  models:
    - name: google/gemma-4-31B-it
      # Additional arguments appended only for this model's vLLM container.
      extraArgs: []
      autoscaling: {}
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
  resources: {}
  autoscaling:
    # Requires KEDA + KEDA HTTP add-on installed in the cluster.
    # Every model uses an InterceptorRoute + ScaledObject pair and starts from replicas.min.
    # Set replicas.min > 0 to keep a model warm.
    # The chart creates per-model proxy Services that resolve to this shared
    # interceptor proxy, so gateway requests queue and trigger scale-up from zero replicas.
    interceptorProxyUrl: http://keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local:8080
    default:
      # Additional hostnames to match besides the generated per-model proxy Service hostnames.
      # Set these only if another caller sends traffic through the interceptor with explicit Host headers.
      hosts: []
      pathPrefixes:
        - /v1
      # Used as InterceptorRoute spec.scalingMetric.concurrency.targetValue.
      targetPendingRequests: 100
      scaledownPeriod: 300
      replicas:
        min: 0
        max: 1
        # cooldownPeriod is set on the KEDA ScaledObject generated by the
        # HTTP add-on. This annotation lets you override the default.
      scaledObjectAnnotations: {}
      annotations: {}

serviceAccount:
  create: false
  name: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: duihua.local
      paths:
        - path: /
          pathType: Prefix
  tls: []