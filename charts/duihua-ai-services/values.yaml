gateway:
  replicaCount: 1
  image:
    repository: ghcr.io/example/duihua-gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    defaultModel: google/gemma-4-31B-it
    upstreamBaseUrl: http://vllm:8000/v1

inference:
  enabled: true
  image:
    repository: vllm/vllm-openai
    tag: latest
    pullPolicy: IfNotPresent
  models:
    - name: google/gemma-4-31B-it
      autoscaling: {}
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
  resources: {}
  autoscaling:
    # Requires KEDA + KEDA HTTP add-on installed in the cluster.
    # Every model uses an InterceptorRoute + ScaledObject pair and starts from replicas.min.
    # Set replicas.min > 0 to keep a model warm.
    # Gateway model traffic is routed through interceptorProxyUrl so
    # requests queue and trigger scale-up from zero replicas.
    interceptorProxyUrl: http://keda-add-ons-http-interceptor-proxy.keda:8080
    default:
      hosts: []
      pathPrefixes:
        - /v1
      # Used as InterceptorRoute spec.scalingMetric.concurrency.targetValue.
      targetPendingRequests: 100
      scaledownPeriod: 300
      replicas:
        min: 0
        max: 1
        # cooldownPeriod is set on the KEDA ScaledObject generated by the
        # HTTP add-on. This annotation lets you override the default.
      scaledObjectAnnotations: {}
      annotations: {}

serviceAccount:
  create: true
  name: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: duihua.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
