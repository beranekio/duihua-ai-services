gateway:
  replicaCount: 1
  image:
    repository: ghcr.io/example/duihua-gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    responseIdStoreUrl: redis://valkey:6379
    responseIdStoreKeyPrefix: duihua:responses
    responseIdStoreTtlSeconds: "86400"
    defaultModel: google/gemma-4-31B-it
    upstreamBaseUrl: http://vllm:8000/v1
  responsesApiStore:
    # Persist completed Responses API objects and conversation input in Valkey
    # from the gateway. This does not enable vLLM's in-memory response store, so
    # inference deployments may use multiple replicas and scale to zero.
    enabled: false
    backgroundJobs:
      # Run background=true Responses API requests as Kubernetes Jobs that call
      # upstream inference synchronously and persist the completed response in Valkey.
      enabled: true
      ttlSecondsAfterFinished: 600
      # Defaults to gateway.resources when unset.
      resources: {}

backgroundWorker:
  # Separate image for background Responses API Jobs.
  # The gateway deployment still uses gateway.image; only Jobs use the worker image.
  image:
    repository: ghcr.io/example/duihua-background-worker
    tag: "0.1.0"
    pullPolicy: IfNotPresent

inference:
  enabled: true
  image:
    repository: vllm/vllm-openai
    tag: latest
    pullPolicy: IfNotPresent
  # Additional arguments appended to every vLLM inference container.
  extraArgs: []
  models:
    - name: google/gemma-4-31B-it
      # Additional arguments appended only for this model's vLLM container.
      extraArgs: []
      autoscaling: {}
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
  resources: {}
  autoscaling:
    # Requires KEDA + KEDA HTTP add-on installed in the cluster.
    # Every model uses an InterceptorRoute + ScaledObject pair and starts from replicas.min.
    # Set replicas.min > 0 to keep a model warm.
    # The chart creates per-model proxy Services that resolve to this shared
    # interceptor proxy, so gateway requests queue and trigger scale-up from zero replicas.
    interceptorProxyUrl: http://keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local:8080
    default:
      # Additional hostnames to match besides the generated per-model proxy Service hostnames.
      # Set these only if another caller sends traffic through the interceptor with explicit Host headers.
      hosts: []
      pathPrefixes:
        - /v1
      # Used as InterceptorRoute spec.scalingMetric.concurrency.targetValue.
      targetPendingRequests: 100
      scaledownPeriod: 300
      replicas:
        min: 0
        max: 1
        # cooldownPeriod is set on the KEDA ScaledObject generated by the
        # HTTP add-on. This annotation lets you override the default.
      scaledObjectAnnotations: {}
      annotations: {}

valkey:
  enabled: false
  image:
    repository: valkey/valkey
    tag: "9.1.0-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

serviceAccount:
  # Created only when gateway background jobs are enabled.
  create: false
  name: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: duihua.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
