gateway:
  replicaCount: 1
  image:
    repository: ghcr.io/example/duihua-gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    responseIdStoreUrl: redis://valkey:6379
    responseIdStoreKeyPrefix: duihua:responses
    responseIdStoreTtlSeconds: "86400"
    defaultModel: google/gemma-4-31B-it
    upstreamBaseUrl: http://vllm:8000/v1
  responsesApiStore:
    # Persist completed Responses API objects and conversation input in Valkey
    # from the gateway. This does not enable vLLM's in-memory response store, so
    # inference deployments may use multiple replicas and scale to zero.
    enabled: false

backgroundWorker:
  # Consume background=true Responses API jobs from a Valkey stream when the
  # gateway response store is enabled.
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/example/duihua-background-worker
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  streamKey: duihua:responses:background
  # Used by the gateway for stale-response reconciliation on GET /v1/responses/{id}.
  staleSeconds: 3600
  consumerGroup: duihua-background
  blockMs: 5000
  pendingRetrySeconds: 30
  # Maximum simultaneous upstream calls per worker pod.
  maxConcurrentJobs: 1
  # SIGTERM grace for rollout drain; should exceed upstream timeout + blockMs + margin.
  terminationGracePeriodSeconds: 665
  upstreamTimeoutSeconds: "600"
  autoscaling:
    # Scale the worker Deployment from Valkey stream consumer-group lag via KEDA.
    # Requires KEDA installed in the cluster (no HTTP add-on needed for this scaler).
    # Use lagCount + activationLagCount for scale-to-zero; Valkey/Redis 7+ is required.
    # activationLagCount must be 0 for the first queued job to wake a worker (KEDA uses >).
    # Lag-only scaling can scale down while jobs are in-flight; see issue #52 and tune
    # scaledownPeriod relative to upstream job duration when min is 0.
    enabled: false
    lagCount: 5
    activationLagCount: 0
    scaledownPeriod: 300
    pollingInterval: 15
    # Set enableTLS or use a rediss:// responseIdStoreUrl for TLS. passwordFromEnv names an
    # env var on the worker Deployment (for example from a Secret); KEDA reads it from the
    # scale target pod.
    enableTLS: false
    passwordFromEnv: ""
    replicas:
      min: 1
      max: 4
    scaledObjectAnnotations: {}
  queueBootstrap:
    # Helm hook Job that creates the stream consumer group when autoscaling uses min: 0.
    # Uses the chart Valkey image when valkey.enabled=true; otherwise configure an image
    # reachable from your cluster (for example a mirrored redis image in air-gapped envs).
    image:
      repository: redis
      tag: 7-alpine
      pullPolicy: IfNotPresent
    # When using an external rediss:// store, set true only if you accept skipping TLS
    # verification for the bootstrap connection (prefer mounting a CA via a future option).
    tlsInsecure: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

inference:
  enabled: true
  image:
    repository: vllm/vllm-openai
    tag: latest
    pullPolicy: IfNotPresent
  # Additional arguments appended to every vLLM inference container.
  extraArgs: []
  models:
    - name: google/gemma-4-31B-it
      # Additional arguments appended only for this model's vLLM container.
      extraArgs: []
      autoscaling: {}
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
  resources: {}
  autoscaling:
    # Requires KEDA + KEDA HTTP add-on installed in the cluster.
    # Every model uses an InterceptorRoute + ScaledObject pair and starts from replicas.min.
    # Set replicas.min > 0 to keep a model warm.
    # The chart creates per-model proxy Services that resolve to this shared
    # interceptor proxy, so gateway requests queue and trigger scale-up from zero replicas.
    interceptorProxyUrl: http://keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local:8080
    default:
      # Additional hostnames to match besides the generated per-model proxy Service hostnames.
      # Set these only if another caller sends traffic through the interceptor with explicit Host headers.
      hosts: []
      pathPrefixes:
        - /v1
      # Used as InterceptorRoute spec.scalingMetric.concurrency.targetValue.
      targetPendingRequests: 100
      scaledownPeriod: 300
      replicas:
        min: 0
        max: 1
        # cooldownPeriod is set on the KEDA ScaledObject generated by the
        # HTTP add-on. This annotation lets you override the default.
      scaledObjectAnnotations: {}
      annotations: {}

valkey:
  enabled: false
  image:
    repository: valkey/valkey
    tag: "9.1.0-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

serviceAccount:
  create: false
  name: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: duihua.local
      paths:
        - path: /
          pathType: Prefix
  tls: []